openapi: 3.0.3
info:
  title: Hospital Management API
  version: 1.0.0
  description: API REST du frontend web (Vue.js) et de l'application mobile (Flutter).
paths:
  /api/v1/audit/logs/:
    get:
      operationId: audit_logs_list
      description: Consultation du journal (rôle ADMIN). Lecture seule.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
  /api/v1/audit/logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: Consultation du journal (rôle ADMIN). Lecture seule.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Rotation du refresh token : l''ancien est mis en liste noire.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/patients/:
    get:
      operationId: patients_list
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date
      - in: query
        name: created_before
        schema:
          type: string
          format: date
      - in: query
        name: ordering
        schema:
          enum:
          - nom
          - prenom
          - created_at
          - numero_dossier
          - -nom
          - -prenom
          - -created_at
          - -numero_dossier
          type: string
          minLength: 1
        description: |-
          * `nom` - nom
          * `prenom` - prenom
          * `created_at` - created_at
          * `numero_dossier` - numero_dossier
          * `-nom` - -nom
          * `-prenom` - -prenom
          * `-created_at` - -created_at
          * `-numero_dossier` - -numero_dossier
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Recherche (nom, prénom, n° dossier, téléphone)
      - in: query
        name: sexe
        schema:
          enum:
          - M
          - F
          type: string
          minLength: 1
        description: |-
          * `M` - M
          * `F` - F
      tags:
      - patients
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientListList'
          description: ''
    post:
      operationId: patients_create
      tags:
      - patients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatientWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatientWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetail'
          description: ''
  /api/v1/patients/{public_id}/:
    get:
      operationId: patients_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patients
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetail'
          description: ''
    patch:
      operationId: patients_partial_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPatientWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPatientWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPatientWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetail'
          description: ''
    delete:
      operationId: patients_destroy
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patients
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_username:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        metadata:
          type: object
          additionalProperties: {}
          readOnly: true
        request_id:
          type: string
          readOnly: true
      required:
      - action
      - actor_username
      - created_at
      - id
      - metadata
      - request_id
      - target_id
      - target_type
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - refresh
      - user
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    PaginatedAuditEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
    PaginatedPatientListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PatientList'
    PatchedPatientWriteRequest:
      type: object
      description: Entrée de création/modification. Les champs non listés ici sont
        ignorés.
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 100
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        sexe:
          $ref: '#/components/schemas/SexeEnum'
        date_naissance:
          type: string
          format: date
          nullable: true
        lieu_naissance:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        adresse:
          type: string
          maxLength: 255
        profession:
          type: string
          maxLength: 100
        personne_contact_nom:
          type: string
          maxLength: 150
        personne_contact_telephone:
          type: string
          maxLength: 30
        assurance_nom:
          type: string
          maxLength: 100
        assurance_numero:
          type: string
          maxLength: 50
        taux_prise_en_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        allow_duplicate:
          type: boolean
          writeOnly: true
          description: 'Forcer la création malgré un doublon probable (défaut : faux).'
    PatientDetail:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        numero_dossier:
          type: string
          readOnly: true
        nom:
          type: string
          readOnly: true
        prenom:
          type: string
          readOnly: true
        sexe:
          allOf:
          - $ref: '#/components/schemas/SexeEnum'
          readOnly: true
        date_naissance:
          type: string
          format: date
          readOnly: true
          nullable: true
        telephone:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        age:
          type: integer
          nullable: true
          readOnly: true
        lieu_naissance:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        adresse:
          type: string
          readOnly: true
        profession:
          type: string
          readOnly: true
        personne_contact_nom:
          type: string
          readOnly: true
        personne_contact_telephone:
          type: string
          readOnly: true
        assurance_nom:
          type: string
          readOnly: true
        assurance_numero:
          type: string
          readOnly: true
        taux_prise_en_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - adresse
      - age
      - assurance_nom
      - assurance_numero
      - created_at
      - date_naissance
      - email
      - lieu_naissance
      - nom
      - numero_dossier
      - personne_contact_nom
      - personne_contact_telephone
      - prenom
      - profession
      - public_id
      - sexe
      - taux_prise_en_charge
      - telephone
      - updated_at
    PatientList:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        numero_dossier:
          type: string
          readOnly: true
        nom:
          type: string
          readOnly: true
        prenom:
          type: string
          readOnly: true
        sexe:
          allOf:
          - $ref: '#/components/schemas/SexeEnum'
          readOnly: true
        date_naissance:
          type: string
          format: date
          readOnly: true
          nullable: true
        telephone:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_naissance
      - nom
      - numero_dossier
      - prenom
      - public_id
      - sexe
      - telephone
    PatientWriteRequest:
      type: object
      description: Entrée de création/modification. Les champs non listés ici sont
        ignorés.
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 100
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        sexe:
          $ref: '#/components/schemas/SexeEnum'
        date_naissance:
          type: string
          format: date
          nullable: true
        lieu_naissance:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        adresse:
          type: string
          maxLength: 255
        profession:
          type: string
          maxLength: 100
        personne_contact_nom:
          type: string
          maxLength: 150
        personne_contact_telephone:
          type: string
          maxLength: 30
        assurance_nom:
          type: string
          maxLength: 100
        assurance_numero:
          type: string
          maxLength: 50
        taux_prise_en_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        allow_duplicate:
          type: boolean
          writeOnly: true
          description: 'Forcer la création malgré un doublon probable (défaut : faux).'
      required:
      - nom
      - prenom
      - sexe
    SexeEnum:
      enum:
      - M
      - F
      type: string
      description: |-
        * `M` - M
        * `F` - F
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserSummary:
      type: object
      description: |-
        Profil renvoyé au client : le frontend (web/mobile) en déduit les droits d'affichage.

        Les permissions sont informatives : le serveur reste l'autorité sur chaque endpoint.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        telephone:
          type: string
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - first_name
      - last_name
      - permissions
      - public_id
      - roles
      - telephone
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
