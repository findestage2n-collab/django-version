# Environnement de DÉVELOPPEMENT : MySQL 8.4, API Django, Vite.
# Aucun Redis ni worker : le système n'a besoin d'aucun service externe (voir docs/06).
# Hors ligne : télécharger les images une fois (docker pull), puis `docker save` / `docker load`.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospital}
      MYSQL_USER: ${MYSQL_USER:-hospital}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?définir MYSQL_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?définir MYSQL_ROOT_PASSWORD dans .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["${MYSQL_PORT:-3307}:3306"]
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py seed_roles && python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-mysql://${MYSQL_USER:-hospital}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-hospital}}
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on:
      - backend

volumes:
  db_data:
  frontend_node_modules:
